[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawcerto"
version = "0.1.0.dev1"
description = "Research framework for reinforcement-learning whole-body control of quadrupedal manipulators"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "scipy"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.8", "trimesh", "pycollada"]
analysis = ["matplotlib>=3.9"]
unifp = ["pydelatin==0.3.0"]

[tool.setuptools.packages.find]
include = ["pawcerto*"]
namespaces = true

[tool.setuptools.package-data]
"pawcerto.methods.umi_on_legs" = ["LICENSE"]
"pawcerto.methods.roboduet" = ["LICENSE", "LICENSES/*/LICENSE"]
"pawcerto.methods.unifp" = ["LICENSE", "LICENSES/*/LICENSE"]
"pawcerto.methods.learning_force_control" = ["LICENSE", "LICENSES/*/LICENSE", "LICENSES/PROVENANCE.md"]
"pawcerto.methods.deepwbc" = ["LICENSE"]
"pawcerto.methods.deepwbc.training" = ["LICENSE"]
